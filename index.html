<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mini Jogo de Corrida</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        h2 {
            margin-bottom: 5px;
        }
        canvas {
            background-color: #444;
            border: 5px solid #777;
            box-shadow: 0 0 15px black;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>🚦 Mini Corrida Retrô 🚦</h2>
    <p>Use as <b>setas Esquerda e Direita</b> do teclado para desviar dos carros vermelhos!</p>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configurações do carro do jogador
        let carWidth = 40;
        let carHeight = 70;
        let playerX = canvas.width / 2 - carWidth / 2;
        let playerY = canvas.height - carHeight - 20;
        let playerSpeed = 6; // Velocidade de movimento lateral

        // Controles
        let leftPressed = false;
        let rightPressed = false;

        // Variáveis do jogo
        let obstacles = [];
        let score = 0;
        let gameSpeed = 4; // Velocidade da pista
        let isGameOver = false;

        // Escuta os botões do teclado
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);

        function keyDownHandler(e) {
            if(e.key == "Right" || e.key == "ArrowRight") rightPressed = true;
            else if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = true;
        }

        function keyUpHandler(e) {
            if(e.key == "Right" || e.key == "ArrowRight") rightPressed = false;
            else if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = false;
        }

        // Função para desenhar os carros
        function drawCar(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, carWidth, carHeight);
            
            // Desenha os vidros para parecer mais com um carro
            ctx.fillStyle = "#add8e6"; // Azul claro
            ctx.fillRect(x + 5, y + 10, carWidth - 10, 15); // Para-brisa
            ctx.fillRect(x + 5, y + 45, carWidth - 10, 15); // Vidro traseiro
        }

        // Função para desenhar a faixa da estrada
        function drawRoad() {
            ctx.fillStyle = "white";
            ctx.setLineDash([30, 30]); // Cria o efeito pontilhado
            ctx.beginPath();
            // Move a linha para criar ilusão de velocidade
            ctx.moveTo(canvas.width / 2, 0 - (score % 60)); 
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.lineWidth = 5;
            ctx.strokeStyle = "white";
            ctx.stroke();
        }

        // Função para desenhar a pontuação
        function drawScore() {
            ctx.font = "20px Arial";
            ctx.fillStyle = "yellow";
            ctx.fillText("Pontos: " + Math.floor(score / 10), 10, 30);
        }

        // Tela de Fim de Jogo
        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "40px Arial";
            ctx.fillStyle = "red";
            ctx.fillText("BATIDA!", 120, canvas.height / 2);
            ctx.font = "20px Arial";
            ctx.fillStyle = "white";
            ctx.fillText("Aperte F5 para jogar de novo", 70, canvas.height / 2 + 40);
        }

        // Loop principal do jogo
        function update() {
            if (isGameOver) {
                drawGameOver();
                return; // Para o jogo se bater
            }

            // Limpa a tela a cada frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawRoad();
            drawScore();

            // Movimenta o jogador
            if (rightPressed && playerX < canvas.width - carWidth) {
                playerX += playerSpeed;
            }
            else if (leftPressed && playerX > 0) {
                playerX -= playerSpeed;
            }

            // Desenha o jogador (Carro Azul)
            drawCar(playerX, playerY, "#007BFF");

            // Cria carros inimigos (obstáculos) aleatoriamente
            if (Math.random() < 0.03) {
                let obsX = Math.random() * (canvas.width - carWidth);
                obstacles.push({x: obsX, y: -carHeight});
            }

            // Atualiza e desenha os inimigos
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].y += gameSpeed; // Inimigo desce a tela
                drawCar(obstacles[i].x, obstacles[i].y, "#DC3545"); // Carro Vermelho

                // Lógica de Colisão (se o jogador bater no inimigo)
                if (playerX < obstacles[i].x + carWidth &&
                    playerX + carWidth > obstacles[i].x &&
                    playerY < obstacles[i].y + carHeight &&
                    carHeight + playerY > obstacles[i].y) {
                    isGameOver = true;
                }

                // Remove os carros que já saíram da tela para não pesar o PC
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            score++;
            
            // Aumenta a dificuldade com o tempo
            if (score % 500 == 0) {
                gameSpeed += 0.5;
            }

            // Chama o próximo frame
            requestAnimationFrame(update);
        }

        // Inicia o jogo
        update();
    </script>
</body>
</html>
