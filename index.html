<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Corrida 3D no Browser</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        #game-over h1 {
            color: #ff3333;
            margin-top: 0;
        }
        #game-over p {
            font-size: 18px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Pontos: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>BATIDA! 💥</h1>
        <p>Você bateu o carro!</p>
        <p>Aperte <b>F5</b> para jogar novamente.</p>
    </div>

    <script>
        // Configuração da Cena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 20, 120);

        // Configuração da Câmera em Perspectiva (Visão em 3ª pessoa)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Renderizador 3D (WebGL)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Iluminação da cena
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Dimensões da Pista
        const roadWidth = 14;
        const roadLength = 200;

        // Terreno das laterais (Grama)
        const grassGeo = new THREE.PlaneGeometry(200, roadLength);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x1e5631 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        scene.add(grass);

        // Asfalto da Pista
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        scene.add(road);

        // Faixas pontilhadas da pista
        const stripes = [];
        const stripeGeo = new THREE.PlaneGeometry(0.4, 4);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        for (let z = -roadLength / 2; z < roadLength / 2; z += 12) {
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(0, 0.02, z);
            scene.add(stripe);
            stripes.push(stripe);
        }

        // Função para construir o modelo 3D do carro
        function createCarMesh(colorHex, isPlayer = false) {
            const carGroup = new THREE.Group();

            // Chassi / Corpo principal
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMat = new THREE.MeshPhongMaterial({ color: colorHex });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            // Cabine / Teto
            const roofGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
            const roofMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 1.2, -0.2);
            roof.castShadow = true;
            carGroup.add(roof);

            // Rodas 3D
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-1.1, 0.4, 1.2],
                [1.1, 0.4, 1.2],
                [-1.1, 0.4, -1.2],
                [1.1, 0.4, -1.2]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            // Faróis e Lanternas
            const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            
            // Faróis Dianteiros (Brancos)
            const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const headL = new THREE.Mesh(lightGeo, headLightMat);
            headL.position.set(-0.6, 0.7, -2.01);
            const headR = new THREE.Mesh(lightGeo, headLightMat);
            headR.position.set(0.6, 0.7, -2.01);
            carGroup.add(headL, headR);

            // Lanternas Traseiras (Vermelhas)
            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const tailL = new THREE.Mesh(lightGeo, tailLightMat);
            tailL.position.set(-0.6, 0.7, 2.01);
            const tailR = new THREE.Mesh(lightGeo, tailLightMat);
            tailR.position.set(0.6, 0.7, 2.01);
            carGroup.add(tailL, tailR);

            // Listra no capô para o jogador
            if (isPlayer) {
                const stripeGeo = new THREE.BoxGeometry(0.4, 0.82, 4.02);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.position.y = 0.61;
                carGroup.add(stripe);
            }

            return carGroup;
        }

        // Criando o carro do jogador
        const playerCar = createCarMesh(0x0066ff, true);
        playerCar.position.set(0, 0, 10);
        scene.add(playerCar);

        // Posicionando a câmera atrás do carro do jogador
        camera.position.set(0, 4, 17);
        camera.lookAt(playerCar.position.x, 1, playerCar.position.z - 10);

        // Controles via teclado (Setas ou A/D)
        const keys = { left: false, right: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // Variáveis do Estado do Jogo
        let obstacles = [];
        let score = 0;
        let speed = 0.8;
        let isGameOver = false;

        function spawnObstacle() {
            const enemyColors = [0xcc0000, 0x00cc44, 0xeeaa00, 0x9900cc];
            const randomColor = enemyColors[Math.floor(Math.random() * enemyColors.length)];
            const obstacle = createCarMesh(randomColor, false);
            
            // Sorteia uma das 4 faixas da pista
            const lanes = [-4.5, -1.5, 1.5, 4.5];
            const laneX = lanes[Math.floor(Math.random() * lanes.length)];
            
            obstacle.position.set(laneX, 0, -80);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        let frameCounter = 0;

        // Loop de Animação 3D
        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // Movimentação do jogador com inclinação suave na curva
            const steerSpeed = 0.25;
            const maxBound = (roadWidth / 2) - 1.5;

            if (keys.left && playerCar.position.x > -maxBound) {
                playerCar.position.x -= steerSpeed;
                playerCar.rotation.z = 0.1; // Inclição leve pra esquerda
            } else if (keys.right && playerCar.position.x < maxBound) {
                playerCar.position.x += steerSpeed;
                playerCar.rotation.z = -0.1; // Inclinação leve pra direita
            } else {
                playerCar.rotation.z = 0;
            }

            // Movimenta as faixas para simular alta velocidade
            stripes.forEach(s => {
                s.position.z += speed;
                if (s.position.z > 30) {
                    s.position.z -= roadLength;
                }
            });

            // Criar carros inimigos com o tempo
            frameCounter++;
            if (frameCounter % Math.max(30, Math.floor(80 - score / 100)) === 0) {
                spawnObstacle();
            }

            // Movimentação e Checagem de Colisão 3D
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                // Colisão por Caixa Bounding Box Simples
                const dx = Math.abs(playerCar.position.x - obs.position.x);
                const dz = Math.abs(playerCar.position.z - obs.position.z);

                if (dx < 1.8 && dz < 3.2) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                }

                // Remove carros que passaram da tela
                if (obs.position.z > 25) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Pontuação e Dificuldade progressiva
            score += 1;
            speed += 0.0002;
            document.getElementById('score').innerText = Math.floor(score / 10);

            // Renderizar a cena a cada frame
            renderer.render(scene, camera);
        }

        // Ajusta a tela caso mude o tamanho da janela do navegador
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Inicia o loop
        animate();
    </script>
</body>
</html>
