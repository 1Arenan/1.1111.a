
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone UI - Dark Mode com Imagem</title>
    <!-- Adicionando FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset e Variáveis Básicas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* Barra Lateral Esquerda (Sidebar) */
        .sidebar {
            width: 80px;
            border-right: 1px solid #262626;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            align-items: center;
        }

        .sidebar-icon {
            margin-bottom: 30px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .sidebar-icon:hover { transform: scale(1.1); }
        .sidebar-icon img.profile-pic-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ccc;
        }

        /* Área Principal */
        .main-container {
            display: flex;
            flex: 1;
            overflow-y: auto;
            justify-content: center;
            padding-top: 30px;
        }

        .content-area {
            width: 100%;
            max-width: 630px;
            margin-right: 32px;
        }

        /* Stories */
        .stories-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .stories-container::-webkit-scrollbar { display: none; }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 66px;
            cursor: pointer;
        }

        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #000;
            background-color: #444;
            overflow: hidden;
        }

        .story-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-username {
            font-size: 12px;
            margin-top: 5px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            text-align: center;
            color: #a8a8a8;
        }

        /* Feed Post */
        .post {
            border-bottom: 1px solid #262626;
            padding-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-user-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #555;
            overflow: hidden;
        }

        .post-user-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-username { font-weight: 600; font-size: 14px; }
        .post-time { color: #a8a8a8; font-size: 14px; }
        .post-options { color: #fff; cursor: pointer; }

        .post-image-container {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            background-color: #262626;
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #262626;
        }

        .post-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Faz a imagem preencher o espaço sem amassar */
        }

        /* Painel Direito (Sugestões e Perfil) */
        .right-panel {
            width: 320px;
            margin-top: 20px;
            display: none;
        }

        @media (min-width: 1000px) { .right-panel { display: block; } }

        .profile-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .profile-summary .info { display: flex; align-items: center; gap: 15px; }
        .profile-summary .avatar { width: 44px; height: 44px; border-radius: 50%; background-color: #777; overflow: hidden; }
        .profile-summary .names .username { font-weight: 600; font-size: 14px; }
        .profile-summary .names .fullname { color: #a8a8a8; font-size: 14px; margin-top: 2px; }
        .action-text { color: #0095f6; font-size: 12px; font-weight: 600; cursor: pointer; }

        .suggestions-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .suggestions-header span { color: #a8a8a8; font-weight: 600; font-size: 14px; }
        .suggestions-header a { font-size: 12px; font-weight: 600; }

        .suggestion-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        /* Modal / Chat Flutuante à Direita */
        .chat-overlay {
            position: fixed;
            bottom: 0;
            right: 80px;
            width: 350px;
            height: 500px;
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 12px 12px 0 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            font-weight: 600;
        }
        
        .chat-header-left { display: flex; align-items: center; gap: 10px; }
        .chat-header-actions { display: flex; gap: 15px; color: #fff; font-size: 18px; }

        .chat-content {
            flex: 1;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chat-image-placeholder {
            width: 90%;
            height: 80%;
            background-color: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            overflow: hidden;
        }

        .chat-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-input-area {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #121212;
        }

        .chat-input-box {
            flex: 1;
            background-color: #262626;
            border: none;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
        }

        .chat-icons { display: flex; gap: 12px; font-size: 20px; color: #fff; cursor: pointer;}
    </style>
</head>
<body>

    <!-- Barra Lateral -->
    <nav class="sidebar">
        <i class="fa-brands fa-instagram sidebar-icon"></i>
        <i class="fa-solid fa-house sidebar-icon"></i>
        <i class="fa-solid fa-magnifying-glass sidebar-icon"></i>
        <i class="fa-brands fa-wpexplorer sidebar-icon"></i>
        <i class="fa-solid fa-clapperboard sidebar-icon"></i>
        <i class="fa-regular fa-paper-plane sidebar-icon"></i>
        <i class="fa-regular fa-heart sidebar-icon"></i>
        <i class="fa-regular fa-square-plus sidebar-icon"></i>
        <!-- Exemplo de avatar na barra lateral usando a imagem -->
        <div class="sidebar-icon">
            <img src="image_ad46de.jpg" alt="Perfil" class="profile-pic-small">
        </div>
        <i class="fa-solid fa-bars sidebar-icon" style="margin-top: auto;"></i>
    </nav>

    <!-- Container Principal -->
    <main class="main-container">
        
        <!-- Feed de Conteúdo -->
        <div class="content-area">
            
            <!-- Stories -->
            <div class="stories-container">
                <div class="story">
                    <div class="story-ring"><div class="story-img"><img src="image_ad46de.jpg" alt="Story"></div></div>
                    <span class="story-username">brun1zyz.r...</span>
                </div>
                <div class="story">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span class="story-username">lucindovp....</span>
                </div>
                <div class="story">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span class="story-username">iae_kayke_...</span>
                </div>
                <div class="story">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span class="story-username">renan_vini...</span>
                </div>
                <div class="story">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span class="story-username">thurxpz.012</span>
                </div>
                <div class="story">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span class="story-username">arthur077_...</span>
                </div>
            </div>

            <!-- Post Único -->
            <article class="post">
                <div class="post-header">
                    <div class="post-user-info">
                        <div class="post-user-img">
                            <img src="image_ad46de.jpg" alt="Avatar">
                        </div>
                        <span class="post-username">isaque_gabriel_044 <span class="post-time">• 1 d</span></span>
                    </div>
                    <i class="fa-solid fa-ellipsis post-options"></i>
                </div>
                <div class="post-image-container">
                    <!-- Imagem principal do feed inserida aqui -->
                    <img src="image_ad46de.jpg" alt="Foto do Feed: Academia">
                </div>
            </article>
        </div>

        <!-- Painel Lateral Direito -->
        <aside class="right-panel">
            <div class="profile-summary">
                <div class="info">
                    <div class="avatar">
                        <img src="image_ad46de.jpg" alt="Seu Perfil" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="names">
                        <div class="username">renanguimaraesdo</div>
                        <div class="fullname">Renan Guimarães do Rosario</div>
                    </div>
                </div>
                <div class="action-text">Trocar</div>
            </div>

            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>

            <!-- Item Sugestão -->
            <div class="suggestion-item">
                <div class="profile-summary" style="margin-bottom: 0;">
                    <div class="info">
                        <div class="avatar" style="width: 32px; height: 32px;"></div>
                        <div class="names">
                            <div class="username" style="font-size: 13px;">guil...</div>
                        </div>
                    </div>
                </div>
                <div class="action-text">Seguir</div>
            </div>
        </aside>

    </main>

    <!-- Chat/Modal Flutuante à Direita -->
    <div class="chat-overlay">
        <div class="chat-header">
            <div class="chat-header-left">
                <i class="fa-solid fa-chevron-left"></i>

        <div class="chat-content">
            <div class="chat-image-placeholder">
                <!-- Imagem do chat inserida aqui -->
                <img src="image_ad46de.jpg" alt="Imagem enviada no chat">
            </div>
        </div>

        <div class="chat-input-area">
            <i class="fa-regular fa-face-smile chat-icons"></i>
            <input type="text" class="chat-input-box" placeholder="Mensagem...">
            <i class="fa-solid fa-microphone chat-icons"></i>
            <i class="fa-regular fa-image chat-icons"></i>
            <i class="fa-regular fa-heart chat-icons"></i>
        </div>
    </div>

</body>
</html>
